apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.env.POSTGRES_HOST }}
  namespace: {{ .Values.microservice.namespace }}
spec:
  serviceName: {{ .Values.env.POSTGRES_HOST }}
  replicas: 1  # one writer. Do not scale this to 2 without Postgres replication.
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.env.POSTGRES_HOST }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: js-ml-dashboard
        app.kubernetes.io/component: database  # this is the split: app Deployment vs this StatefulSet
        app.kubernetes.io/instance: {{ .Values.env.POSTGRES_HOST }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
          env:
            # Do not envFrom the app Secret — that would also inject API keys into Postgres.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.microservice.name }}-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.microservice.name }}-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.microservice.name }}-config
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: {{ .Values.postgres.resources.memory }}
              cpu: {{ .Values.postgres.resources.cpu }}
            limits:
              memory: {{ .Values.postgres.resources.memory }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
